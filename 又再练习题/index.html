.page{
  max-width:1460px;
  margin:6px auto;
  padding:8px;
}
.main-card{
  background:rgba(255,255,255,.78);
  border:2px solid rgba(255,255,255,.72);
  border-radius:24px;
  box-shadow:0 12px 24px rgba(0,0,0,.10);
  padding:10px 12px 12px;
  backdrop-filter:blur(2px);
}
.top-bank{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin:0 auto 8px;
}
.source-chip{
  user-select:none;
  -webkit-user-select:none;
  width:108px;
  height:76px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  font-weight:800;
  color:#fff;
  cursor:grab;
  box-shadow:0 8px 16px rgba(0,0,0,.14);
}
.source-chip:active{cursor:grabbing}
.source-you{background:linear-gradient(180deg,#ef8a67,#d55a31)}
.source-zai{background:linear-gradient(180deg,#79b86b,#4d9441)}

.exercise-panel{
  max-width:1380px;
  margin:0 auto;
  background:rgba(255,255,255,.85);
  border:2px solid #efdfd4;
  border-radius:20px;
  padding:10px;
}
.sentences{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 10px;
}
.sentence-card{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) 82px;
  align-items:center;
  gap:8px;
  background:#fffdfb;
  border:2px solid #edd7cb;
  border-radius:16px;
  padding:8px 10px;
  min-height:74px;
}
.sentence-card.correct-card{border-color:#4f9442;background:#f5fff1}
.sentence-card.wrong-card{border-color:#cf3c2f;background:#fff4f3}

.num{
  width:30px;height:30px;border-radius:50%;
  background:#f4d5cb;color:#7f2d1f;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;
}
.sentence-line{
  font-size:24px;
  line-height:1.25;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:flex-start;
  text-align:left;
  gap:4px;
  word-break:break-word;
}
.part{display:inline}
.blank{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:56px;
  height:38px;
  padding:0 8px;
  border:3px dashed #d16b52;
  border-radius:10px;
  background:#fff6f2;
  color:#b33a16;
  font-size:28px;
  font-weight:700;
  vertical-align:middle;
  transition:.15s ease;
}
.blank.filled{border-style:solid;color:#fff}
.blank.filled-you{background:linear-gradient(180deg,#ef8a67,#d55a31);border-color:#d55a31}
.blank.filled-zai{background:linear-gradient(180deg,#79b86b,#4d9441);border-color:#4d9441}
.blank.hover{transform:scale(1.04);box-shadow:0 6px 14px rgba(0,0,0,.10)}
.blank.correct{box-shadow:0 0 0 3px rgba(79,148,66,.20)}
.blank.wrong{box-shadow:0 0 0 3px rgba(207,60,47,.18)}

.actions{display:flex;gap:6px;justify-content:flex-end}
.icon-btn,.control-btn{
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-family:inherit;
}
.icon-btn{
  width:36px;height:36px;
  background:#f7e2d9;
  font-size:19px;
}
.audio-btn:hover{background:#f2d1c2}
.check-one-btn{background:#e8f2e3;color:#2f7c23;font-size:22px;font-weight:700}
.check-one-btn:hover{background:#d9edd0}

.controls{
  margin-top:10px;
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}
.control-btn{
  padding:8px 14px;
  font-size:20px;
  font-weight:700;
  background:#fff;
  border:2px solid #e2d9cc;
  color:#6c4a1e;
}
.control-btn.primary{background:#bf5a3d;border-color:#bf5a3d;color:#fff}
.status{
  margin-top:6px;
  text-align:center;
  font-size:21px;
  font-weight:700;
  min-height:26px;
  color:#7f2d1f;
}

.drag-ghost{
  position:fixed;
  z-index:9999;
  pointer-events:none;
  width:76px;
  height:76px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  font-weight:800;
  color:#fff;
  box-shadow:0 10px 18px rgba(0,0,0,.18);
}
.drag-ghost.you{background:linear-gradient(180deg,#ef8a67,#d55a31)}
.drag-ghost.zai{background:linear-gradient(180deg,#79b86b,#4d9441)}

.overlay{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:9998;
}
.particle{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%);
  pointer-events:none;
}
.star{
  font-size:22px;
  color:#ffd33d;
  text-shadow:0 0 8px rgba(255,211,61,.55);
  animation:starBurst .95s ease-out forwards;
}
.shard{
  width:16px;
  height:20px;
  background:linear-gradient(145deg, rgba(255,255,255,.95), rgba(181,220,255,.75));
  border:1px solid rgba(112,163,209,.72);
  clip-path:polygon(50% 0%, 100% 38%, 75% 100%, 15% 78%, 0% 35%);
  box-shadow:0 0 10px rgba(130,170,215,.28);
  animation:shardFly .95s ease-out forwards;
}
@keyframes starBurst{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(0deg) scale(.6)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1.35)}
}
@keyframes shardFly{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(0deg) scale(.65)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1.18)}
}

@media (max-width:1180px){
  .sentences{grid-template-columns:1fr}
  .sentence-line{font-size:23px}
}
@media (max-width:760px){
  .top-bank{gap:10px}
  .source-chip{width:94px;height:68px;font-size:46px}
  .sentence-card{grid-template-columns:30px minmax(0,1fr) 76px;min-height:72px;padding:8px}
  .sentence-line{font-size:20px}
  .blank{min-width:50px;height:34px;font-size:24px}
  .icon-btn{width:34px;height:34px;font-size:18px}
  .drag-ghost{width:68px;height:68px;font-size:44px}
}
</style>

function centerOf(el){
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function starBurst(originEl){
  const c = centerOf(originEl);
  for (let i = 0; i < 18; i++){
    const star = document.createElement('div');
    star.className = 'particle star';
    star.textContent = Math.random() > 0.35 ? '★' : '✦';
    const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.25;
    const dist = 50 + Math.random() * 90;
    star.style.left = c.x + 'px';
    star.style.top = c.y + 'px';
    star.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    star.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
    star.style.setProperty('--rot', Math.round(Math.random() * 540 - 270) + 'deg');
    star.style.fontSize = (18 + Math.random() * 14) + 'px';
    overlay.appendChild(star);
    setTimeout(() => star.remove(), 1000);
  }
  try { successAudio.pause(); successAudio.currentTime = 0; successAudio.play(); } catch(e){}
}

function shardBurst(originEl){
  const c = centerOf(originEl);
  for (let i = 0; i < 16; i++){
    const shard = document.createElement('div');
    shard.className = 'particle shard';
    const angle = (Math.PI * 2 * i) / 16 + Math.random() * 0.3;
    const dist = 50 + Math.random() * 90;
    shard.style.left = c.x + 'px';
    shard.style.top = c.y + 'px';
    shard.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    shard.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
    shard.style.setProperty('--rot', Math.round(Math.random() * 900 - 450) + 'deg');
    shard.style.width = (12 + Math.random() * 12) + 'px';
    shard.style.height = (14 + Math.random() * 14) + 'px';
    overlay.appendChild(shard);
    setTimeout(() => shard.remove(), 1000);
  }
  try { failAudio.pause(); failAudio.currentTime = 0; failAudio.play(); } catch(e){}
}

document.querySelectorAll('.audio-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    const card = e.currentTarget.closest('.sentence-card');
    speak(card.dataset.full, 0.88, 1);
  });
});

sourceChips.forEach(chip => {
  chip.addEventListener('click', () => speak(chip.dataset.char, 0.8, 1.05));
});

function applyFilledStyle(blank, char){
  blank.classList.remove('filled-you', 'filled-zai');
  if (char === '又') blank.classList.add('filled-you');
  if (char === '再') blank.classList.add('filled-zai');
}

let activeDrag = null;

sourceChips.forEach(chip => {
  chip.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const char = chip.dataset.char;
    const rect = chip.getBoundingClientRect();
    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost ' + (char === '又' ? 'you' : 'zai');
    ghost.textContent = char;
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    document.body.appendChild(ghost);

    activeDrag = {
      char: char,
      ghost: ghost,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top
    };
  });
});

document.addEventListener('pointermove', (e) => {
  if (!activeDrag) return;
  activeDrag.ghost.style.left = (e.clientX - activeDrag.offsetX) + 'px';
  activeDrag.ghost.style.top = (e.clientY - activeDrag.offsetY) + 'px';
  blanks.forEach(blank => blank.classList.remove('hover'));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const blank = el && el.closest ? el.closest('.blank') : null;
  if (blank) blank.classList.add('hover');
});

document.addEventListener('pointerup', (e) => {
  if (!activeDrag) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const blank = el && el.closest ? el.closest('.blank') : null;
  blanks.forEach(b => b.classList.remove('hover'));

  if (blank) {
    blank.textContent = activeDrag.char;
    blank.dataset.filled = activeDrag.char;
    blank.classList.add('filled');
    blank.classList.remove('correct', 'wrong');
    applyFilledStyle(blank, activeDrag.char);
    const card = blank.closest('.sentence-card');
    card.classList.remove('correct-card', 'wrong-card');
    status.textContent = '';
    speak(activeDrag.char, 0.8, 1.05);
  }

  activeDrag.ghost.remove();
  activeDrag = null;
});

blanks.forEach(blank => {
  blank.addEventListener('click', () => {
    if (blank.dataset.filled) speak(blank.dataset.filled, 0.8, 1.05);
  });
  blank.addEventListener('dblclick', () => {
    blank.textContent = '';
    blank.dataset.filled = '';
    blank.className = 'blank';
    const card = blank.closest('.sentence-card');
    card.classList.remove('correct-card', 'wrong-card');
    status.textContent = '';
  });
});

function checkCard(card){
  const blank = card.querySelector('.blank');
  const expected = card.dataset.answer;
  const filled = blank.dataset.filled || '';
  blank.classList.remove('correct', 'wrong');
  card.classList.remove('correct-card', 'wrong-card');

  if (filled === expected){
    blank.classList.add('correct');
    card.classList.add('correct-card');
    starBurst(card);
    return true;
  } else {
    blank.classList.add('wrong');
    card.classList.add('wrong-card');
    shardBurst(card);
    return false;
  }
}

document.querySelectorAll('.check-one-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    const card = e.currentTarget.closest('.sentence-card');
    checkCard(card);
  });
});

checkAllBtn.addEventListener('click', () => {
  let count = 0;
  cards.forEach(card => {
    if (checkCard(card)) count += 1;
  });
  status.textContent = '正确：' + count + ' / ' + cards.length;
  speak('正确 ' + count, 0.9, 1);
});

resetBtn.addEventListener('click', () => {
  blanks.forEach(blank => {
    blank.textContent = '';
    blank.dataset.filled = '';
    blank.className = 'blank';
  });
  cards.forEach(card => card.classList.remove('correct-card', 'wrong-card'));
  status.textContent = '';
});
</script>
</body>
</html>
