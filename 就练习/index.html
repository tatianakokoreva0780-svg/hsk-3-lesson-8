: "single", "base_question_html": "你<span class=\"q-focus\">几号有时间</span>？", "question_map": {"有时间": "你<span class=\"q-focus\">几号有时间</span>？", "方便": "你<span class=\"q-focus\">几号方便</span>？", "放假": "你<span class=\"q-focus\">几号放假</span>？", "不忙": "你<span class=\"q-focus\">几号不忙</span>？", "想去": "你<span class=\"q-focus\">几号想去</span>？"}, "prefix_html": "你<span class=\"pat-focus\">几号</span>", "suffix_html": "，我们<span class=\"pat-jiu\">就</span><span class=\"pat-focus\">几号</span>见面。", "options": ["有时间", "方便", "放假", "不忙", "想去"], "sentences": {"有时间": "你几号有时间，我们就几号见面。", "方便": "你几号方便，我们就几号见面。", "放假": "你几号放假，我们就几号见面。", "不忙": "你几号不忙，我们就几号见面。", "想去": "你几号想去，我们就几号见面。"}}, {"tab": "问题十一", "type": "single", "base_question_html": "你<span class=\"q-focus\">几月去中国</span>？", "question_map": {"去中国": "你<span class=\"q-focus\">几月去中国</span>？", "放假": "你<span class=\"q-focus\">几月放假</span>？", "有时间": "你<span class=\"q-focus\">几月有时间</span>？", "想去": "你<span class=\"q-focus\">几月想去</span>？", "开始学中文": "你<span class=\"q-focus\">几月开始学中文</span>？"}, "prefix_html": "你<span class=\"pat-focus\">几月</span>", "suffix_html": "，我<span class=\"pat-jiu\">就</span><span class=\"pat-focus\">几月</span>去中国。", "options": ["去中国", "放假", "有时间", "想去", "开始学中文"], "sentences": {"去中国": "你几月去中国，我就几月去中国。", "放假": "你几月放假，我就几月放假。", "有时间": "你几月有时间，我就几月有时间。", "想去": "你几月想去，我就几月想去。", "开始学中文": "你几月开始学中文，我就几月开始学中文。"}}, {"tab": "问题十二", "type": "double", "question_prefix_html": "你想", "question_suffix_html": "<span class=\"pat-focus\">多久</span>？", "answer_prefix_html": "你想", "answer_mid_html": "<span class=\"pat-focus\">多久</span>，我<span class=\"pat-jiu\">就</span>", "answer_suffix_html": "<span class=\"pat-focus\">多久</span>。", "options": ["学", "玩儿", "住", "等", "练习"]}, {"tab": "问题十三", "type": "single", "base_question_html": "你想买<span class=\"q-focus\">哪件</span>衣服？", "question_map": {}, "prefix_html": "<span class=\"pat-focus\">哪件</span>", "suffix_html": "，我<span class=\"pat-jiu\">就</span>买<span class=\"pat-focus\">哪件</span>。", "options": ["好看", "便宜", "舒服", "漂亮", "合适"], "sentences": {"好看": "哪件好看，我就买哪件。", "便宜": "哪件便宜，我就买哪件。", "舒服": "哪件舒服，我就买哪件。", "漂亮": "哪件漂亮，我就买哪件。", "合适": "哪件合适，我就买哪件。"}}, {"tab": "问题十四", "type": "double", "question_prefix_html": "你<span class=\"pat-focus\">几点</span>", "question_suffix_html": "？", "answer_prefix_html": "你<span class=\"pat-focus\">几点</span>", "answer_mid_html": "，我<span class=\"pat-jiu\">就</span><span class=\"pat-focus\">几点</span>", "answer_suffix_html": "。", "options": ["出发", "起床", "吃早饭", "去学校", "回家"]}];
let currentIndex = 0;
let selectedOption = null;
let draggedOption = null;
let questionChoice = null;
let answerChoice = null;

function getBestChineseVoice() {
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  if (!voices || !voices.length) return null;
  const preferredNames = ['Microsoft Xiaoxiao', 'Xiaoxiao', 'Microsoft Yunxi', 'Yunxi', 'Ting-Ting', 'Tingting', 'Mei-Jia', 'Sin-ji', 'Yaoyao'];
  const zhVoices = voices.filter(v => (v.lang || '').toLowerCase().startsWith('zh'));
  if (!zhVoices.length) return null;
  for (const name of preferredNames) {
    const found = zhVoices.find(v => (v.name || '').includes(name));
    if (found) return found;
  }
  return zhVoices.find(v => (v.lang || '').toLowerCase() === 'zh-cn') || zhVoices[0];
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance((text || '').replace(/\s+/g,''));
  u.lang = 'zh-CN';
  u.rate = 0.88;
  u.pitch = 1;
  const v = getBestChineseVoice();
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function resetState() {
  selectedOption = null;
  questionChoice = null;
  answerChoice = null;
}

function buildTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  DATA.forEach((item, index) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (index === currentIndex ? ' active' : '');
    btn.textContent = item.tab;
    btn.onclick = () => {
      currentIndex = index;
      resetState();
      render();
    };
    tabs.appendChild(btn);
  });
}

function getQuestionHTML(item) {
  if (item.type === 'double') {
    const qWord = questionChoice
      ? `<span class="dropzone filled" id="qDrop"><span class="filled-chip">${questionChoice}</span></span>`
      : `<span class="dropzone" id="qDrop"><span class="drop-placeholder">拖到这里</span></span>`;
    return `${item.question_prefix_html}${qWord}${item.question_suffix_html}`;
  }
  if (selectedOption && item.question_map && item.question_map[selectedOption]) {
    return item.question_map[selectedOption];
  }
  return item.base_question_html;
}

function getAnswerHTML(item) {
  if (item.type === 'double') {
    const qWord = questionChoice
      ? `<span class="dropzone filled" id="aQDrop"><span class="filled-chip">${questionChoice}</span></span>`
      : `<span class="dropzone" id="aQDrop"><span class="drop-placeholder">拖到这里</span></span>`;
    const aWord = answerChoice
      ? `<span class="dropzone filled" id="aADrop"><span class="filled-chip">${answerChoice}</span></span>`
      : `<span class="dropzone" id="aADrop"><span class="drop-placeholder">拖到这里</span></span>`;
    const speakBtn = (questionChoice && answerChoice) ? ` <button class="speak-btn" id="speakBtn" title="朗读">🔊</button>` : '';
    return `${item.answer_prefix_html}${qWord}${item.answer_mid_html}${aWord}${item.answer_suffix_html}${speakBtn}`;
  }
  if (!selectedOption) {
    return `${item.prefix_html}<span class="dropzone" id="dropzone"><span class="drop-placeholder">拖到这里</span></span>${item.suffix_html}`;
  }
  return `${item.prefix_html}<span class="dropzone filled" id="dropzone"><span class="filled-chip">${selectedOption}</span></span>${item.suffix_html} <button class="speak-btn" id="speakBtn" title="朗读">🔊</button>`;
}

function setupSingleDropzone() {
  const dz = document.getElementById('dropzone');
  if (!dz) return;
  dz.addEventListener('dragover', (e) => {
    e.preventDefault();
    dz.classList.add('drag-over');
  });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', (e) => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    const value = e.dataTransfer.getData('text/plain') || draggedOption;
    if (value) {
      selectedOption = value;
      render();
    }
  });
}

function setupDualDropzone(id, setter) {
  const dz = document.getElementById(id);
  if (!dz) return;
  dz.addEventListener('dragover', (e) => {
    e.preventDefault();
    dz.classList.add('drag-over');
  });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', (e) => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    const value = e.dataTransfer.getData('text/plain') || draggedOption;
    if (value) {
      setter(value);
      render();
    }
  });
}

function setupOptions(item) {
  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  item.options.forEach(opt => {
    const btn = document.createElement('button');
    const isUsed = (item.type === 'single' && selectedOption === opt);
    btn.className = 'option' + (isUsed ? ' used' : '');
    btn.textContent = opt;
    btn.draggable = true;
    btn.addEventListener('dragstart', (e) => {
      draggedOption = opt;
      e.dataTransfer.setData('text/plain', opt);
      e.dataTransfer.effectAllowed = 'move';
    });
    btn.addEventListener('dragend', () => {
      draggedOption = null;
    });
    box.appendChild(btn);
  });
}

function buildDoubleSentence(item) {
  if (item.tab === '问题十二') {
    return `你想${questionChoice}多久，我就${answerChoice}多久。`;
  }
  if (item.tab === '问题十四') {
    return `你几点${questionChoice}，我就几点${answerChoice}。`;
  }
  return '';
}

function render() {
  buildTabs();
  const item = DATA[currentIndex];
  document.getElementById('questionText').innerHTML = getQuestionHTML(item);
  const answerLine = document.getElementById('answerLine');
  answerLine.innerHTML = getAnswerHTML(item);

  if (item.type === 'double') {
    setupDualDropzone('qDrop', (value) => questionChoice = value);
    setupDualDropzone('aQDrop', (value) => questionChoice = value);
    setupDualDropzone('aADrop', (value) => answerChoice = value);
  } else {
    setupSingleDropzone();
  }

  setupOptions(item);

  const speakBtn = document.getElementById('speakBtn');
  if (speakBtn) {
    speakBtn.onclick = (e) => {
      e.stopPropagation();
      if (item.type === 'double') {
        speak(buildDoubleSentence(item));
      } else if (selectedOption) {
        speak(item.sentences[selectedOption]);
      }
    };
  }
}

document.getElementById('resetBtn').addEventListener('click', () => {
  resetState();
  render();
});

if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => {};
}

render();
</script>
