body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.12);
  pointer-events:none;
  z-index:-1;
}
.page{
  max-width:1180px;
  margin:0 auto;
  background:rgba(255,255,255,.82);
  border:4px solid rgba(255,255,255,.9);
  border-radius:28px;
  padding:18px;
  box-shadow:0 16px 42px rgba(0,0,0,.28);
  backdrop-filter:blur(3px);
}
.header{
  background:linear-gradient(135deg,#2f9e44,#74b816);
  color:white;
  border-radius:20px;
  padding:14px 20px;
  box-shadow:0 8px 20px rgba(0,0,0,.22);
  margin-bottom:12px;
}
h1{margin:0;font-size:32px}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}
.tab-btn{
  border:none;
  border-radius:18px;
  padding:13px;
  font-size:24px;
  font-weight:900;
  cursor:pointer;
  background:#fff;
  color:#2b8a3e;
  border:3px solid #b2f2bb;
  box-shadow:0 6px 14px rgba(0,0,0,.14);
}
.tab-btn.active{
  background:#37b24d;
  color:white;
}
.tab{display:none}
.tab.active{
  display:grid;
  grid-template-columns:230px 1fr;
  gap:16px;
}
.bank{
  background:rgba(255,255,255,.96);
  border:4px solid #b2f2bb;
  border-radius:22px;
  padding:14px;
  box-shadow:0 10px 24px rgba(0,0,0,.20);
  position:sticky;
  top:12px;
  align-self:start;
}
.bank-title{
  text-align:center;
  font-size:24px;
  font-weight:900;
  margin-bottom:12px;
}
.words{
  display:grid;
  gap:10px;
}
.word{
  border:none;
  border-radius:16px;
  background:#fff9db;
  border:3px solid #ffd43b;
  padding:12px 8px;
  font-size:27px;
  font-weight:900;
  cursor:grab;
  box-shadow:0 5px 12px rgba(0,0,0,.16);
}
.word:active{cursor:grabbing}
.work{
  background:rgba(255,255,255,.96);
  border:4px solid rgba(47,158,68,.35);
  border-radius:24px;
  padding:14px;
  box-shadow:0 10px 26px rgba(0,0,0,.22);
}
.sentence-card{
  display:grid;
  grid-template-columns:46px 42px 1fr 72px;
  gap:10px;
  align-items:center;
  background:#fff;
  border:3px solid #e9ecef;
  border-radius:18px;
  padding:11px;
  margin-bottom:10px;
  box-shadow:0 5px 13px rgba(0,0,0,.10);
}
.num{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:36px;height:36px;
  background:#69a35f;
  color:white;
  border-radius:50%;
  font-size:22px;
  font-weight:900;
}
.sentence{
  font-size:29px;
  font-weight:900;
  line-height:1.45;
}
.drop{
  display:inline-flex;
  min-width:128px;
  min-height:40px;
  align-items:center;
  justify-content:center;
  border-bottom:4px solid #333;
  color:#888;
  margin:0 4px;
  padding:0 8px;
  vertical-align:middle;
}
.drop.filled{
  color:#111;
  background:#fff3bf;
  border:3px solid #ffd43b;
  border-radius:12px;
}
.drop.correct{
  background:#ebfbee;
  border:3px solid #2f9e44;
  color:#087f5b;
}
.drop.wrong{
  background:#fff5f5;
  border:3px solid #e03131;
  color:#c92a2a;
}
.speak,.mini-check,.big-btn{
  border:none;
  border-radius:14px;
  padding:10px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  color:white;
}
.speak{background:#4c6ef5}
.mini-check{background:#2f9e44}
.controls{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:12px;
}
.big-btn.check{background:#2f9e44}
.big-btn.clear{background:#868e96}
.msg{
  min-height:28px;
  margin-top:10px;
  font-size:22px;
  font-weight:900;
  text-align:right;
}
.star{
  position:fixed;
  font-size:24px;
  pointer-events:none;
  animation:starFall 900ms ease-out forwards;
  z-index:9999;
}
@keyframes starFall{
  from{transform:translate(0,0) scale(1);opacity:1}
  to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(280deg);opacity:0}
}
.shard{
  position:fixed;
  width:16px;height:16px;
  background:rgba(170,220,255,.85);
  border:1px solid rgba(255,255,255,.8);
  clip-path:polygon(50% 0,100% 80%,0 100%);
  pointer-events:none;
  animation:shatter 750ms ease-out forwards;
  z-index:9999;
}
@keyframes shatter{
  from{transform:translate(0,0) rotate(0);opacity:1}
  to{transform:translate(var(--dx),var(--dy)) rotate(420deg);opacity:0}
}
@media(max-width:900px){
  .tab.active{grid-template-columns:1fr}
  .words{grid-template-columns:repeat(5,1fr)}
  .sentence-card{grid-template-columns:42px 38px 1fr;}
  .mini-check{grid-column:1/-1}
  .sentence{font-size:24px}
}

/* === compact dialogue layout for tab2 + audio buttons === */
.speakall { background:#4f73e8 !important; }
.stopaudio { background:#6b7280 !important; }

#tab2 .work {
  gap: 8px !important;
}

#tab2 .sentence-card {
  padding: 8px 12px !important;
  min-height: auto !important;
}

#tab2 .dialogue-sentence {
  display: flex !important;
  flex-direction: column !important;
  gap: 3px !important;
  line-height: 1.2 !important;
}

#tab2 .dialogue-line {
  display: block !important;
  white-space: normal !important;
}

#tab2 .sentence {
  font-size: clamp(20px, 1.65vw, 25px) !important;
}

#tab2 .drop {
  min-width: 112px !important;
  padding: 0 14px !important;
  margin: 0 5px !important;
}

#tab2 .mini-check,
#tab2 .speak {
  transform: scale(.92);
}

#tab2 .controls {
  margin-top: 4px !important;
}

@media (min-width: 900px) {
  body {
    overflow: hidden !important;
  }
  .page {
    height: calc(100vh - 32px) !important;
    max-height: calc(100vh - 32px) !important;
    overflow: hidden !important;
  }
  #tab2.tab.active {
    height: calc(100vh - 155px) !important;
    overflow: hidden !important;
  }
  #tab2 .bank,
  #tab2 .work {
    max-height: 100% !important;
    overflow: hidden !important;
  }
}
</style>

<script>
let draggedWord = "";

document.querySelectorAll(".word").forEach(btn => {
  btn.addEventListener("dragstart", e => {
    draggedWord = btn.dataset.word;
    e.dataTransfer.setData("text/plain", draggedWord);
  });
});

document.querySelectorAll(".drop").forEach(drop => {
  drop.addEventListener("dragover", e => e.preventDefault());
  drop.addEventListener("drop", e => {
    e.preventDefault();
    const word = e.dataTransfer.getData("text/plain") || draggedWord;
    if(!word) return;
    drop.textContent = word;
    drop.classList.add("filled");
    drop.classList.remove("correct","wrong");
  });
});

function openTab(event,id){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  event.currentTarget.classList.add("active");
}

function playSound(id){
  const audio=document.getElementById(id);
  audio.pause();
  audio.currentTime=0;
  audio.play().catch(()=>{});
}

function stars(){
  for(let i=0;i<35;i++){
    const s=document.createElement("div");
    s.className="star";
    s.textContent="⭐";
    s.style.left=(window.innerWidth/2)+"px";
    s.style.top=(window.innerHeight/2)+"px";
    s.style.setProperty("--dx",(Math.random()*600-300)+"px");
    s.style.setProperty("--dy",(Math.random()*-420+160)+"px");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),950);
  }
}

function shards(){
  for(let i=0;i<45;i++){
    const sh=document.createElement("div");
    sh.className="shard";
    sh.style.left=(window.innerWidth/2)+"px";
    sh.style.top=(window.innerHeight/2)+"px";
    sh.style.setProperty("--dx",(Math.random()*700-350)+"px");
    sh.style.setProperty("--dy",(Math.random()*500-250)+"px");
    document.body.appendChild(sh);
    setTimeout(()=>sh.remove(),800);
  }
}

function checkOne(btn){
  const card=btn.closest(".sentence-card");
  const drop=card.querySelector(".drop");
  const ok=drop.textContent.trim()===drop.dataset.answer;
  drop.classList.remove("correct","wrong");
  if(ok){
    drop.classList.add("correct");
    playSound("okSound");
    stars();
  }else{
    drop.classList.add("wrong");
    playSound("badSound");
    shards();
  }
}

function checkTab(tabId){
  let correct=0;
  const drops=document.querySelectorAll("#"+tabId+" .drop");
  drops.forEach(drop=>{
    drop.classList.remove("correct","wrong");
    if(drop.textContent.trim()===drop.dataset.answer){
      drop.classList.add("correct");
      correct++;
    }else{
      drop.classList.add("wrong");
    }
  });
  const msg=document.getElementById("msg-"+tabId);
  msg.textContent=correct===drops.length ? "太好了！全部正确 ✅" : "正确：" + correct + " / " + drops.length;
  msg.style.color=correct===drops.length ? "#2f9e44" : "#d94848";
  if(correct===drops.length){playSound("okSound");stars();}
  else{playSound("badSound");shards();}
}

function clearTab(tabId){
  document.querySelectorAll("#"+tabId+" .drop").forEach(drop=>{
    drop.textContent="_____";
    drop.classList.remove("filled","correct","wrong");
  });
  document.getElementById("msg-"+tabId).textContent="";
}


function stopAudio(){
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
}

function speakTab(tabId){
  if(!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const cards = Array.from(document.querySelectorAll("#"+tabId+" .sentence-card"));
  const texts = cards.map(card => {
    const btn = card.querySelector(".speak");
    const onclick = btn ? btn.getAttribute("onclick") : "";
    const m = onclick.match(/speakText\('([\s\S]*?)'\)/);
    return m ? m[1] : card.innerText.replace(/检查/g,"");
  }).filter(Boolean);

  let i = 0;
  function next(){
    if(i >= texts.length) return;
    const u = new SpeechSynthesisUtterance(texts[i].replace(/<br>/g," "));
    u.lang = "zh-CN";
    u.rate = .85;
    u.onend = () => {
      i++;
      setTimeout(next, 220);
    };
    speechSynthesis.speak(u);
  }
  next();
}

function speakText(text){
  if(!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/<br>/g," "));
  u.lang="zh-CN";
  u.rate=.85;
  speechSynthesis.speak(u);
}
</script>
