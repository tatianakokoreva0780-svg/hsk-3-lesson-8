.page{
  max-width:1180px;
  margin:22px auto;
  padding:18px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  background:rgba(255,255,255,.86);
  border:3px solid #f5c66d;
  border-radius:26px;
  padding:16px 18px;
  box-shadow:0 12px 28px rgba(70,90,130,.13);
}
.title-wrap{
  display:flex;
  gap:10px;
  align-items:center;
}
.side-label{
  background:#f36f35;
  color:white;
  border-radius:20px;
  padding:12px 16px;
  font-family:Arial, sans-serif;
  font-weight:900;
  text-align:center;
  line-height:1.15;
  font-size:24px;
}
h1{
  margin:0;
  font-size:46px;
  color:#18236a;
  letter-spacing:2px;
}
.pinyin{
  font-family:Arial, sans-serif;
  font-size:22px;
  font-weight:800;
  color:#2d3f8d;
  margin-top:4px;
}
.english{
  font-family:Arial, sans-serif;
  font-size:21px;
  font-weight:800;
  color:#333;
  margin-top:6px;
}
.buttons{display:flex;gap:10px;flex-wrap:wrap}
button{
  border:none;
  border-radius:14px;
  padding:10px 16px;
  font-family:inherit;
  font-size:20px;
  font-weight:900;
  color:#fff;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.14);
}
.speak{background:#5d6fe8}
.clear{background:#707b8f}
.check{background:#22a66b}
.orange{background:#f08c00}
.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:16px 0 14px;
}
.tab{
  border:3px solid #d9e5ff;
  background:rgba(255,255,255,.95);
  color:#344466;
  border-radius:15px;
  padding:10px 18px;
  font-size:23px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(60,80,130,.12);
}
.tab.active{
  background:#fff1e8;
  border-color:#ff9f61;
  color:#843a11;
}
.panel{
  background:rgba(255,255,255,.92);
  border:3px solid #dce6ff;
  border-radius:24px;
  padding:18px;
  box-shadow:0 10px 24px rgba(25,40,70,.14);
  min-height:620px;
}
.hidden{display:none}
.section-title{
  font-size:30px;
  font-weight:900;
  color:#253b72;
  margin-bottom:14px;
}
.hero-grid{
  display:grid;
  grid-template-columns:1.18fr .82fr;
  gap:18px;
  align-items:start;
}
.explain{
  background:#fffaf0;
  border:3px solid #f5c66d;
  border-radius:22px;
  padding:18px;
  font-size:27px;
  line-height:1.55;
  font-weight:900;
  color:#111827;
}
.explain .red{color:#e4572e}
.image-card{
  background:#fff;
  border:3px solid #dce6ff;
  border-radius:22px;
  padding:14px;
  box-shadow:0 8px 18px rgba(0,0,0,.12);
}
.image-card img{
  width:100%;
  display:block;
  border-radius:14px;
}
.big-saying{
  font-size:48px;
  font-weight:900;
  color:#18236a;
  text-align:center;
  margin:8px 0 16px;
}
.slots,.bank{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  margin:18px 0;
}
.slot{
  min-width:170px;
  min-height:70px;
  border:3px dashed #f08c00;
  border-radius:18px;
  background:#fff9e8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:900;
  color:#111827;
}
.slot.comma{
  min-width:60px;
  border:none;
  background:transparent;
  color:#18236a;
}
.tile{
  min-width:150px;
  padding:14px 18px;
  border-radius:18px;
  background:#f1f5ff;
  border:3px solid #9bb7ff;
  box-shadow:0 4px 0 rgba(60,80,130,.12);
  color:#111827;
  font-size:32px;
  font-weight:900;
  text-align:center;
  cursor:grab;
  user-select:none;
}
.tile.used{opacity:.35}
.choice{
  padding:16px 18px;
  margin:12px 0;
  border-radius:20px;
  border:3px solid #dbeafe;
  background:#f8fbff;
  font-size:27px;
  line-height:1.45;
  font-weight:900;
  color:#172554;
  cursor:pointer;
}
.choice.selected{
  border-color:#f08c00;
  background:#fff3d6;
}
.choice.correct{
  border-color:#22a66b;
  background:#eafff0;
}
.choice.wrong{
  border-color:#ef4444;
  background:#fff1f1;
}
.scene-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.match{
  display:grid;
  grid-template-columns: 1fr 1.3fr;
  gap:16px;
}
.match-left,.match-right{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.match-item,.match-target{
  border-radius:18px;
  padding:14px 16px;
  font-size:26px;
  font-weight:900;
  min-height:68px;
  display:flex;
  align-items:center;
}
.match-item{
  border:3px solid #9bb7ff;
  background:#f1f5ff;
  cursor:grab;
  justify-content:center;
}
.match-target{
  border:3px dashed #f08c00;
  background:#fff9e8;
  justify-content:flex-start;
  gap:10px;
}
.match-target.filled{
  border-style:solid;
  border-color:#22a66b;
  background:#eafff0;
}
.small-chip{
  display:inline-block;
  background:white;
  border:2px solid #9bb7ff;
  border-radius:12px;
  padding:6px 10px;
  margin-right:10px;
  color:#18236a;
}
.msg{
  min-height:36px;
  text-align:center;
  font-size:26px;
  font-weight:900;
  margin-top:12px;
}
.ok{color:#159947}
.bad{color:#d33}
.center{text-align:center;margin-top:16px}
@media(max-width:900px){
  .hero-grid,.scene-grid,.match{grid-template-columns:1fr}
  h1{font-size:36px}
  .big-saying{font-size:38px}
  .explain,.choice{font-size:23px}
  .tile,.slot{font-size:28px}
}

.mini-head{
  display:inline-block;
  margin-bottom:10px;
  background:#5d6fe8;
  color:#fff;
  border-radius:14px;
  padding:8px 14px;
  font-size:24px;
  font-weight:900;
}
.match-col{display:flex;flex-direction:column;}
.clearer-match{align-items:flex-start;}
.effect-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:9999;
}
.fx-piece{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  opacity:1;
  will-change:transform, opacity;
  animation:flyOut 900ms ease-out forwards;
}
.star-shape{
  width:22px;
  height:22px;
  background:#ffd84d;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  box-shadow:0 0 10px rgba(255,216,77,.9);
}
.shard-shape{
  width:20px;
  height:20px;
  background:linear-gradient(135deg,#d8eefc,#8bb6d9);
  clip-path: polygon(47% 0%, 100% 24%, 77% 100%, 12% 75%, 0% 28%);
  box-shadow:0 0 8px rgba(160,200,230,.9);
  border:1px solid rgba(255,255,255,.8);
}
@keyframes flyOut{
  0%{opacity:1; transform:translate(-50%,-50%) translate(0,0) rotate(0deg) scale(1);}
  100%{opacity:0; transform:translate(-50%,-50%) translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.65);}
}


.answer-note{
  display:block;
  margin-top:8px;
  font-size:20px;
  color:#0f766e;
  font-weight:900;
}

</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="title-wrap">
      <div><h1>站得高，看得远</h1>
      </div>
    </div>
    <div class="buttons">
      <button class="speak" id="speakBtn">朗读俗语</button>
      <button class="clear" id="clearBtn">清空</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="tab1">1 拼句子</button>
    <button class="tab" data-tab="tab2">2 选意思</button>
    <button class="tab" data-tab="tab3">3 选情况</button>
    <button class="tab" data-tab="tab4">4 配意思</button>
  </div>

  <section class="panel" id="tab1">
    <div class="section-title">拖一拖，组成俗语</div>

<script>
const DATA = {"sayingParts": ["站得高", "，", "看得远"], "meaningCorrect": "站在高的地方，就能看得远。也可以说，看问题的时候，不要只看眼前，要想得远一点儿。", "meaningOptions": ["站在高的地方，就能看得远。也可以说，看问题的时候，不要只看眼前，要想得远一点儿。", "只要走得快，就能到很远的地方。", "看得远的人都站得很高。", "做事情要慢慢来。"], "situations": [{"text": "班里有一个问题，老师说：不要只看今天，也要想一想以后。", "ok": true}, {"text": "一个人站在山上，看到了很远的城市和路。", "ok": true}, {"text": "小明考试错了一个字，就把很多字都擦掉了。", "ok": false}, {"text": "妈妈说：买东西不能只看今天便宜，也要想以后用不用得上。", "ok": true}, {"text": "弟弟站在椅子上拿东西，差点儿摔倒。", "ok": false}], "matchPairs": [{"left": "站得高", "right": "站在高的地方看"}, {"left": "看得远", "right": "能看到更远的地方"}, {"left": "不只看眼前", "right": "不是只想现在"}, {"left": "想以后", "right": "想一想以后会怎样"}, {"left": "看很多方面", "right": "从很多方面想问题"}]};
let dragged = null;

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\s+/g,''));
  u.lang = 'zh-CN';
  u.rate = 0.9;
  const voices = speechSynthesis.getVoices();
  const zh = voices.find(v => (v.lang || '').toLowerCase().startsWith('zh'));
  if (zh) u.voice = zh;
  speechSynthesis.speak(u);
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function triggerEffect(type) {
  const layer = document.getElementById('effectLayer');
  if (!layer) return;
  layer.innerHTML = '';
  const total = type === 'success' ? 20 : 18;
  for (let i = 0; i < total; i++) {
    const piece = document.createElement('div');
    piece.className = 'fx-piece';
    const inner = document.createElement('div');
    inner.className = type === 'success' ? 'star-shape' : 'shard-shape';
    piece.appendChild(inner);
    const angle = Math.random() * Math.PI * 2;
    const distance = 120 + Math.random() * 320;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance;
    const rot = (-280 + Math.random() * 560) + 'deg';
    piece.style.setProperty('--dx', dx + 'px');
    piece.style.setProperty('--dy', dy + 'px');
    piece.style.setProperty('--rot', rot);
    piece.style.animationDuration = (850 + Math.random() * 350) + 'ms';
    inner.style.transform = 'scale(' + (0.7 + Math.random() * 0.8) + ') rotate(' + (Math.random()*360) + 'deg)';
    layer.appendChild(piece);
    setTimeout(() => piece.remove(), 1400);
  }
}

function playSuccess() {
  const a = document.getElementById('successAudio');
  if (a) { a.currentTime = 0; a.play().catch(()=>{}); }
  triggerEffect('success');
}

function playError() {
  const a = document.getElementById('errorAudio');
  if (a) { a.currentTime = 0; a.play().catch(()=>{}); }
  triggerEffect('error');
}


document.getElementById('speakBtn').onclick = () => speak('站得高，看得远');
document.getElementById('clearBtn').onclick = clearAll;

document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
    document.getElementById(btn.dataset.tab).classList.remove('hidden');
  };
});

function setupDrag() {
  document.querySelectorAll('[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragged = el;
      e.dataTransfer.setData('text/plain', el.dataset.say || el.textContent.trim());
    });
    el.addEventListener('dragend', () => dragged = null);
    if (el.classList.contains('speakable')) {
      el.addEventListener('click', () => speak(el.dataset.say || el.textContent.trim()));
    }
  });

  document.querySelectorAll('.slot').forEach(slot => {
    if (slot.classList.contains('comma')) return;
    slot.addEventListener('dragover', e => e.preventDefault());
    slot.addEventListener('drop', e => {
      e.preventDefault();
      const val = e.dataTransfer.getData('text/plain');
      slot.textContent = val;
      slot.dataset.value = val;
    });
  });

  document.querySelectorAll('.match-target').forEach(target => {
    target.addEventListener('dragover', e => e.preventDefault());
    target.addEventListener('drop', e => {
      e.preventDefault();
      const val = e.dataTransfer.getData('text/plain');
      target.dataset.value = val;
      target.classList.add('filled');
      target.querySelector('.drop-here').textContent = val;
    });
  });
}

function renderMeaning() {
  const box = document.getElementById('meaningChoices');
  box.innerHTML = '';
  shuffleArray(DATA.meaningOptions).forEach(opt => {
    const div = document.createElement('div');
    div.className = 'choice speakable';
    div.dataset.value = opt;
    div.dataset.say = opt;
    div.textContent = opt;
    div.onclick = () => {
      document.querySelectorAll('#meaningChoices .choice').forEach(c => c.classList.remove('selected'));
      div.classList.add('selected');
      speak(opt);
    };
    box.appendChild(div);
  });
}

function renderScenes() {
  const box = document.getElementById('sceneChoices');
  box.innerHTML = '';
  shuffleArray(DATA.situations).forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'choice speakable';
    div.dataset.ok = String(s.ok);
    div.dataset.say = s.text;
    div.textContent = s.text;
    div.onclick = () => {
      div.classList.toggle('selected');
      speak(s.text);
    };
    box.appendChild(div);
  });
}

function renderMatch() {
  const left = document.getElementById('matchLeft');
  const right = document.getElementById('matchRight');
  left.innerHTML = '';
  right.innerHTML = '';
  const shuffledLeft = [...DATA.matchPairs].sort(() => Math.random() - .5);
  shuffledLeft.forEach(p => {
    const div = document.createElement('div');
    div.className = 'match-item speakable';
    div.draggable = true;
    div.dataset.say = p.left;
    div.textContent = p.left;
    left.appendChild(div);
  });
  DATA.matchPairs.forEach(p => {
    const div = document.createElement('div');
    div.className = 'match-target';
    div.dataset.answer = p.left;
    div.innerHTML = `<span class="small-chip">${p.right}</span><span class="drop-here">把词语拖到这里</span>`;
    right.appendChild(div);
  });
}

function setMsg(id, text, ok) {
  const msg = document.getElementById(id);
  if (!msg) return;
  msg.textContent = '';
  msg.className = 'msg';
}

document.getElementById('checkSaying').onclick = () => {
  const slots = [...document.querySelectorAll('#sayingSlots .slot:not(.comma)')];
  const ok = slots.every(s => s.dataset.value === s.dataset.answer);
  setMsg('msg1', ok ? '太棒了，俗语拼对了！' : '再看看顺序和词语。', ok);
  ok ? playSuccess() : playError();
};

document.getElementById('checkMeaning').onclick = () => {
  const sel = document.querySelector('#meaningChoices .choice.selected');

  document.querySelectorAll('#meaningChoices .choice').forEach(c => {
    c.classList.remove('correct','wrong');
    c.querySelectorAll('.answer-note').forEach(n => n.remove());
  });

  const correctChoice = [...document.querySelectorAll('#meaningChoices .choice')]
    .find(c => c.dataset.value === DATA.meaningCorrect);

  if (!sel) {
    if (correctChoice) correctChoice.classList.add('correct');
    setMsg('msg2', 'Правильный ответ подсвечен зелёным.', false);
    playError();
    return;
  }

  const ok = sel.dataset.value === DATA.meaningCorrect;

  if (ok) {
    sel.classList.add('correct');
    setMsg('msg2', '正确！', true);
    playSuccess();
  } else {
    sel.classList.add('wrong');
    if (correctChoice) {
      correctChoice.classList.add('correct');
      const note = document.createElement('span');
      note.className = 'answer-note';
      note.textContent = '正确答案';
      correctChoice.appendChild(note);
    }
    setMsg('msg2', 'Неверно. Правильный ответ подсвечен зелёным.', false);
    playError();
  }
};

document.getElementById('checkScene').onclick = () => {
  let ok = true;

  document.querySelectorAll('#sceneChoices .choice').forEach(c => {
    const should = c.dataset.ok === 'true';
    const selected = c.classList.contains('selected');

    c.classList.remove('correct','wrong');
    c.querySelectorAll('.answer-note').forEach(n => n.remove());

    if (should) {
      c.classList.add('correct');
      const note = document.createElement('span');
      note.className = 'answer-note';
      note.textContent = selected ? '✓ 这个可以用' : '正确情况，要选';
      c.appendChild(note);
    }

    if (selected && !should) {
      c.classList.add('wrong');
      const note = document.createElement('span');
      note.className = 'answer-note';
      note.textContent = '这个不合适';
      c.appendChild(note);
      ok = false;
    }

    if (!selected && should) {
      ok = false;
    }
  });

  setMsg('msg3', ok ? '选择正确！' : 'Неверно. Правильные ситуации подсвечены зелёным.', ok);
  ok ? playSuccess() : playError();
};

document.getElementById('checkMatch').onclick = () => {
  let ok = true;
  document.querySelectorAll('.match-target').forEach(t => {
    t.classList.remove('correct','wrong');
    if (t.dataset.value === t.dataset.answer) {
      t.style.borderColor = '#22a66b';
      t.style.background = '#eafff0';
    } else {
      ok = false;
      t.style.borderColor = '#ef4444';
      t.style.background = '#fff1f1';
    }
  });
  setMsg('msg4', ok ? '全部配对正确！' : '有的配对不对，再试试。', ok);
  ok ? playSuccess() : playError();
};

function clearAll() {
  document.querySelectorAll('.slot:not(.comma)').forEach(s => {
    s.textContent = '';
    delete s.dataset.value;
  });
  document.querySelectorAll('.choice').forEach(c => c.classList.remove('selected','correct','wrong'));
  document.querySelectorAll('.match-target').forEach(t => {
    delete t.dataset.value;
    t.classList.remove('filled');
    t.style.borderColor = '';
    t.style.background = '';
    const d = t.querySelector('.drop-here');
    if (d) d.textContent = '拖到这里';
  });
  document.querySelectorAll('.msg').forEach(m => {
    m.textContent = '';
    m.className = 'msg';
  });
}

renderMeaning();
renderScenes();
renderMatch();
setupDrag();

if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
